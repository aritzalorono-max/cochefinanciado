<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — CocheFinanciado.es</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0a0a0a; --ink-2: #3a3a3a; --ink-3: #6b6b6b;
      --line: #e8e8e8; --bg: #f7f7f5; --white: #ffffff;
      --accent: #1a56ff; --success: #16a34a; --gold: #d4a72c;
    }
    body { font-family: 'Sora', sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh; }

    /* LOGIN */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      background: var(--white); border: 1px solid var(--line); border-radius: 20px;
      padding: 48px 40px; width: 100%; max-width: 380px;
    }
    .login-logo { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .login-logo b { color: var(--accent); }
    .login-sub { font-size: .8rem; color: var(--ink-3); margin-bottom: 32px; }
    .login-card label { font-size: .7rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }
    .login-card input[type="password"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--line);
      border-radius: 8px; font-family: 'Sora', sans-serif; font-size: .9rem;
      color: var(--ink); margin-bottom: 16px; transition: border-color .15s;
    }
    .login-card input[type="password"]:focus { outline: none; border-color: var(--accent); }
    .login-card input.err { border-color: #e53e3e; }
    .login-btn {
      width: 100%; background: var(--ink); color: #fff;
      font-family: 'Sora', sans-serif; font-size: .88rem; font-weight: 700;
      padding: 13px; border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s;
    }
    .login-btn:hover { background: var(--accent); }
    .login-err { font-size: .78rem; color: #c53030; margin-top: 10px; display: none; }

    /* ADMIN */
    .admin-wrap { display: none; }

    /* HEADER */
    .admin-hdr {
      background: var(--white); border-bottom: 1px solid var(--line);
      padding: 0 28px; position: sticky; top: 0; z-index: 10;
    }
    .admin-hdr-i {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .admin-logo { font-size: .95rem; font-weight: 700; color: var(--ink); }
    .admin-logo b { color: var(--accent); }
    .admin-logo span { font-size: .72rem; font-weight: 600; color: var(--ink-3); margin-left: 8px; background: var(--bg); padding: 2px 8px; border-radius: 99px; }
    .logout-btn {
      font-size: .78rem; font-weight: 600; color: var(--ink-3);
      background: none; border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 14px; cursor: pointer; font-family: 'Sora', sans-serif;
      transition: color .15s, border-color .15s;
    }
    .logout-btn:hover { color: var(--ink); border-color: var(--ink); }

    /* BODY */
    .admin-body { max-width: 1200px; margin: 0 auto; padding: 36px 28px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
    .stat-card {
      background: var(--white); border: 1px solid var(--line);
      border-radius: 14px; padding: 22px 24px;
    }
    .stat-label { font-size: .72rem; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .stat-val { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink); line-height: 1; }
    .stat-val.blue { color: var(--accent); }
    .stat-val.green { color: var(--success); }

    /* TABS */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab {
      padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--white); font-family: 'Sora', sans-serif;
      font-size: .82rem; font-weight: 600; color: var(--ink-3);
      cursor: pointer; transition: all .15s;
    }
    .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* TABLE */
    .table-wrap { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .table-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--line);
    }
    .table-head h3 { font-size: .9rem; font-weight: 700; }
    .search-input {
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
      font-family: 'Sora', sans-serif; font-size: .82rem; color: var(--ink);
      width: 220px; transition: border-color .15s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      text-align: left; padding: 11px 16px;
      font-size: .68rem; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; color: var(--ink-3);
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    tbody tr { border-bottom: 1px solid var(--line); transition: background .15s; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f4ff; }
    td { padding: 13px 16px; color: var(--ink-2); vertical-align: top; }
    td.name { font-weight: 600; color: var(--ink); }
    td.date { color: var(--ink-3); font-size: .76rem; }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 99px;
      font-size: .7rem; font-weight: 700;
    }
    .badge.lead { background: #eff4ff; color: var(--accent); }
    .badge.contact { background: #f0f9f1; color: var(--success); }
    .empty { text-align: center; padding: 48px; color: var(--ink-3); font-size: .88rem; }
    .loading { text-align: center; padding: 48px; color: var(--ink-3); font-size: .88rem; }

    /* MODAL */
    .modal-bg {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--white); border-radius: 20px;
      padding: 36px; width: 100%; max-width: 520px;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
    .modal-close { font-size: 1.2rem; cursor: pointer; color: var(--ink-3); background: none; border: none; }
    .modal-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .modal-row:last-child { border-bottom: none; }
    .modal-key { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-3); padding-top: 2px; }
    .modal-val { font-size: .88rem; color: var(--ink); word-break: break-word; }
    .modal-val a { color: var(--accent); }

    @media (max-width: 900px) { .stats { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 580px) { .stats { grid-template-columns: 1fr 1fr; } .search-input { width: 140px; } td { padding: 10px 10px; } }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Coche<b>Financiado</b>.es</div>
    <p class="login-sub">Panel de administración</p>
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="login-btn" onclick="doLogin()">Entrar →</button>
    <p class="login-err" id="login-err">Contraseña incorrecta.</p>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="admin-wrap">
  <div class="admin-hdr">
    <div class="admin-hdr-i">
      <div class="admin-logo">Coche<b>Financiado</b>.es <span>Admin</span></div>
      <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="admin-body">
    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total leads</div>
        <div class="stat-val blue" id="s-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hoy</div>
        <div class="stat-val" id="s-today">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Esta semana</div>
        <div class="stat-val" id="s-week">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mensajes contacto</div>
        <div class="stat-val green" id="s-contact">—</div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('leads', this)">Leads reclamación</button>
      <button class="tab" onclick="switchTab('contactos', this)">Mensajes contacto</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-head">
        <h3 id="table-title">Leads reclamación</h3>
        <input class="search-input" type="text" placeholder="Buscar..." oninput="filterTable(this.value)" />
      </div>
      <div id="table-body"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-title">
      Detalle del registro
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  const ADMIN_PASS = 'cochefinanciado2025';
  const SB_URL = 'https://cgnialhpwpnehiywxuqn.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnbmlhbGhwd3BuZWhpeXd4dXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTQ1MzAsImV4cCI6MjA5NTk5MDUzMH0.kKaMfz_5Cpufjt4d26_xFm_CVC4lInLsFI83uaxoX48';

  let allLeads = [], allContactos = [], currentTab = 'leads', currentSearch = '';

  /* AUTH */
  function doLogin() {
    const pwd = document.getElementById('pwd').value;
    if (pwd === ADMIN_PASS) {
      sessionStorage.setItem('admin_auth', '1');
      showAdmin();
    } else {
      document.getElementById('pwd').classList.add('err');
      document.getElementById('login-err').style.display = 'block';
    }
  }
  function doLogout() {
    sessionStorage.removeItem('admin_auth');
    location.reload();
  }
  function showAdmin() {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('admin-wrap').style.display = 'block';
    loadData();
  }
  if (sessionStorage.getItem('admin_auth') === '1') showAdmin();

  /* DATA */
  async function fetchTable(name, order = 'created_at') {
    const res = await fetch(`${SB_URL}/rest/v1/${name}?order=${order}.desc&limit=500`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    });
    return res.ok ? res.json() : [];
  }

  async function loadData() {
    document.getElementById('table-body').innerHTML = '<div class="loading">Cargando…</div>';
    [allLeads, allContactos] = await Promise.all([
      fetchTable('cochefinanciado_leads'),
      fetchTable('cochefinanciado_contactos'),
    ]);
    updateStats();
    renderTable();
  }

  function updateStats() {
    const now = new Date();
    const today = now.toISOString().slice(0,10);
    const weekAgo = new Date(now - 7*24*60*60*1000).toISOString();
    document.getElementById('s-total').textContent = allLeads.length;
    document.getElementById('s-today').textContent = allLeads.filter(r => r.created_at.startsWith(today)).length;
    document.getElementById('s-week').textContent = allLeads.filter(r => r.created_at >= weekAgo).length;
    document.getElementById('s-contact').textContent = allContactos.length;
  }

  /* TABS */
  function switchTab(tab, btn) {
    currentTab = tab; currentSearch = '';
    document.querySelector('.search-input').value = '';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('table-title').textContent = tab === 'leads' ? 'Leads reclamación' : 'Mensajes contacto';
    renderTable();
  }

  function filterTable(q) { currentSearch = q.toLowerCase(); renderTable(); }

  /* RENDER */
  function fmt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
           d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  }

  function renderTable() {
    const data = (currentTab === 'leads' ? allLeads : allContactos).filter(r => {
      if (!currentSearch) return true;
      return JSON.stringify(r).toLowerCase().includes(currentSearch);
    });

    if (!data.length) {
      document.getElementById('table-body').innerHTML = '<div class="empty">No hay registros.</div>';
      return;
    }

    if (currentTab === 'leads') {
      document.getElementById('table-body').innerHTML = `
        <table>
          <thead><tr>
            <th>Nombre</th><th>Email</th><th>Teléfono</th>
            <th>Matrícula</th><th>DNI</th><th>Contrato</th><th>Fecha</th>
          </tr></thead>
          <tbody>${data.map((r,i) => `
            <tr onclick="openModal(${i},'leads')">
              <td class="name">${esc(r.nombre)} ${esc(r.apellidos)}</td>
              <td>${esc(r.email)}</td>
              <td>${esc(r.telefono)}</td>
              <td>${r.matricula ? esc(r.matricula) : '<span style="color:var(--ink-3)">—</span>'}</td>
              <td>${r.dni ? esc(r.dni) : '<span style="color:var(--ink-3)">—</span>'}</td>
              <td>${r.contrato_info ? '<span class="badge lead">Adjunto</span>' : '<span style="color:var(--ink-3);font-size:.76rem">Sin contrato</span>'}</td>
              <td class="date">${fmt(r.created_at)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    } else {
      document.getElementById('table-body').innerHTML = `
        <table>
          <thead><tr>
            <th>Nombre</th><th>Email</th><th>Teléfono</th><th>Mensaje</th><th>Fecha</th>
          </tr></thead>
          <tbody>${data.map((r,i) => `
            <tr onclick="openModal(${i},'contactos')">
              <td class="name">${esc(r.nombre)}</td>
              <td>${esc(r.email)}</td>
              <td>${r.telefono ? esc(r.telefono) : '<span style="color:var(--ink-3)">—</span>'}</td>
              <td style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.mensaje)}</td>
              <td class="date">${fmt(r.created_at)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }
  }

  function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '—'; }

  /* MODAL */
  function openModal(i, tab) {
    const r = tab === 'leads' ? allLeads[i] : allContactos[i];
    const labels = tab === 'leads'
      ? { nombre:'Nombre', apellidos:'Apellidos', email:'Email', telefono:'Teléfono', matricula:'Matrícula', dni:'DNI', contrato_info:'Contrato', created_at:'Fecha' }
      : { nombre:'Nombre', email:'Email', telefono:'Teléfono', mensaje:'Mensaje', created_at:'Fecha' };

    document.getElementById('modal-content').innerHTML = Object.entries(labels).map(([k, label]) => {
      let val = r[k] || '—';
      if (k === 'created_at') val = fmt(r[k]);
      if (k === 'email') val = `<a href="mailto:${esc(r[k])}">${esc(r[k])}</a>`;
      if (k === 'telefono' && r[k]) val = `<a href="tel:${esc(r[k])}">${esc(r[k])}</a>`;
      if (k === 'contrato_info' && r[k]) val = `<a href="${SB_URL}/storage/v1/object/contratos/${esc(r[k])}" target="_blank">Ver archivo →</a>`;
      return `<div class="modal-row"><div class="modal-key">${label}</div><div class="modal-val">${val}</div></div>`;
    }).join('');

    document.getElementById('modal-bg').classList.add('show');
  }

  function closeModal() { document.getElementById('modal-bg').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
